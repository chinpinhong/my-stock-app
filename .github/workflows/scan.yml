name: 每日自动选股

on:
  schedule:
    # 时间为 UTC。大致对应美东时间的盘前、盘中、收盘前（夏令时会有约1小时误差）
    - cron: "0 13 * * 1-5"   # 约 9:00 ET 盘前
    - cron: "30 17 * * 1-5"  # 约 13:30 ET 盘中
    - cron: "30 20 * * 1-5"  # 约 16:30 ET 收盘后
  workflow_dispatch: {}   # 允许在 GitHub 网页上手动点一下立即运行

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: pip install yfinance pandas numpy

      - name: 运行选股脚本
        run: python scan.py

      - name: 提交结果
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "自动更新今日精选"
          file_pattern: data/latest_picks.json
